<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoBench 多通道运行实例</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #F5F5F7;
      --paper-2: #FFFFFF;
      --ink: #1D1D1F;
      --muted: #6E6E73;
      --soft: #86868B;
      --rule: rgba(29,29,31,0.12);
      --accent: #007AFF;
      --accent-ink: #0055CC;
      --success: #34C759;
      --danger: #FF3B30;
      --font-sans: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "Menlo", "SF Mono", "Consolas", monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { width: 100%; max-width: 1200px; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(24px, 2.2vw + 12px, 34px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .diagram-shell {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1100px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · AutoBench Runtime</p>
    <h1>多通道自动测试运行实例</h1>
    <p class="subtitle">Windows · Hub Slot 4 · MI_02 · COM3 · DUT-only（当前多通道不使用仪器）</p>

    <div class="diagram-shell">
      <svg viewBox="0 0 1100 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="autobench-runtime-title autobench-runtime-desc">
        <title id="autobench-runtime-title">AutoBench 多通道自动测试运行实例</title>
        <desc id="autobench-runtime-desc">操作员插入 DUT 后，Windows Slot 监控识别 CH4 和 COM3，主窗口启动 ChannelRunner；测试中拔出 DUT 时 abort 并判定 FAIL。</desc>

        <defs>
          <pattern id="ab-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(29,29,31,0.08)"/>
          </pattern>
          <marker id="ab-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6E6E73"/>
          </marker>
          <marker id="ab-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#007AFF"/>
          </marker>
          <marker id="ab-arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#FF3B30"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="1100" height="840" fill="#F5F5F7"/>
        <rect width="1100" height="840" fill="url(#ab-dots)" opacity="0.55"/>

        <!-- Lifelines -->
        <line x1="110" y1="132" x2="110" y2="720" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="330" y1="132" x2="330" y2="720" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="550" y1="132" x2="550" y2="720" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="770" y1="132" x2="770" y2="720" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="990" y1="132" x2="990" y2="720" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- OPT fragment: unplug during test -->
        <rect x="76" y="470" width="928" height="228" rx="4" fill="rgba(29,29,31,0.02)" stroke="rgba(29,29,31,0.22)" stroke-width="1"/>
        <rect x="76" y="470" width="44" height="16" rx="2" fill="#F5F5F7" stroke="rgba(29,29,31,0.22)" stroke-width="1"/>
        <text x="98" y="482" fill="#6E6E73" font-size="8" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="132" y="484" fill="#6E6E73" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">[测试中拔出 DUT]</text>

        <!-- Activation bars -->
        <rect x="326" y="220" width="8" height="340" fill="rgba(29,29,31,0.06)" stroke="#6E6E73" stroke-width="0.8"/>
        <rect x="546" y="264" width="8" height="404" fill="rgba(29,29,31,0.06)" stroke="#6E6E73" stroke-width="0.8"/>
        <rect x="766" y="264" width="8" height="404" fill="rgba(0,122,255,0.06)" stroke="#007AFF" stroke-width="0.8"/>
        <rect x="986" y="308" width="8" height="324" fill="rgba(29,29,31,0.06)" stroke="#6E6E73" stroke-width="0.8"/>

        <!-- Messages -->
        <line x1="110" y1="176" x2="330" y2="176" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#ab-arrow)"/>
        <line x1="330" y1="220" x2="550" y2="220" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#ab-arrow)"/>
        <line x1="550" y1="264" x2="770" y2="264" stroke="#007AFF" stroke-width="1.4" marker-end="url(#ab-arrow-accent)"/>
        <line x1="770" y1="308" x2="990" y2="308" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#ab-arrow)"/>
        <line x1="990" y1="348" x2="770" y2="348" stroke="#6E6E73" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ab-arrow)"/>
        <path d="M 774 392 L 810 392 L 810 424 L 778 424" fill="none" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#ab-arrow)"/>
        <line x1="110" y1="524" x2="330" y2="524" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#ab-arrow)"/>
        <line x1="330" y1="560" x2="550" y2="560" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#ab-arrow)"/>
        <line x1="550" y1="596" x2="770" y2="596" stroke="#FF3B30" stroke-width="1.3" marker-end="url(#ab-arrow-danger)"/>
        <line x1="770" y1="632" x2="990" y2="632" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#ab-arrow)"/>
        <line x1="770" y1="668" x2="550" y2="668" stroke="#FF3B30" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ab-arrow-danger)"/>

        <!-- Message labels -->
        <rect x="156" y="152" width="128" height="16" rx="2" fill="#F5F5F7"/>
        <text x="220" y="164" fill="#6E6E73" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">插入 DUT · Slot 4</text>

        <rect x="376" y="196" width="128" height="16" rx="2" fill="#F5F5F7"/>
        <text x="440" y="208" fill="#6E6E73" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">上报 CH4 · COM3</text>

        <rect x="596" y="240" width="128" height="16" rx="2" fill="#F5F5F7"/>
        <text x="660" y="252" fill="#0055CC" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">启动 CH4 Runner</text>

        <rect x="816" y="284" width="128" height="16" rx="2" fill="#F5F5F7"/>
        <text x="880" y="296" fill="#6E6E73" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">打开 COM3 / 读 SN</text>

        <rect x="816" y="324" width="128" height="16" rx="2" fill="#F5F5F7"/>
        <text x="880" y="336" fill="#6E6E73" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">返回数据</text>

        <rect x="814" y="398" width="152" height="16" rx="2" fill="#F5F5F7"/>
        <text x="890" y="410" fill="#6E6E73" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">逐项执行 · 写日志/CSV</text>

        <rect x="156" y="500" width="128" height="16" rx="2" fill="#F5F5F7"/>
        <text x="220" y="512" fill="#6E6E73" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">拔出 DUT</text>

        <rect x="380" y="536" width="120" height="16" rx="2" fill="#F5F5F7"/>
        <text x="440" y="548" fill="#6E6E73" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">slot_lost</text>

        <rect x="606" y="572" width="108" height="16" rx="2" fill="#F5F5F7"/>
        <text x="660" y="584" fill="#B3261E" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">abort()</text>

        <rect x="826" y="608" width="108" height="16" rx="2" fill="#F5F5F7"/>
        <text x="880" y="620" fill="#6E6E73" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">close COM3</text>

        <rect x="604" y="644" width="112" height="16" rx="2" fill="#F5F5F7"/>
        <text x="660" y="656" fill="#B3261E" font-size="12" font-weight="500" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">done(FAIL)</text>

        <!-- Actors -->
        <rect x="20" y="64" width="180" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="20" y="64" width="180" height="64" rx="6" fill="rgba(255,255,255,0.82)" stroke="rgba(29,29,31,0.24)" stroke-width="1"/>
        <rect x="30" y="74" width="34" height="12" rx="2" fill="none" stroke="rgba(29,29,31,0.22)" stroke-width="0.8"/>
        <text x="47" y="83" fill="#6E6E73" font-size="7" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="110" y="104" fill="#1D1D1F" font-size="13" font-weight="600" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">操作员</text>
        <text x="110" y="118" fill="#6E6E73" font-size="9" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle">插入 / 拔出</text>

        <rect x="240" y="64" width="180" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="240" y="64" width="180" height="64" rx="6" fill="rgba(255,255,255,0.82)" stroke="rgba(29,29,31,0.24)" stroke-width="1"/>
        <rect x="250" y="74" width="34" height="12" rx="2" fill="none" stroke="rgba(29,29,31,0.22)" stroke-width="0.8"/>
        <text x="267" y="83" fill="#6E6E73" font-size="7" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MON</text>
        <text x="330" y="104" fill="#1D1D1F" font-size="13" font-weight="600" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Slot 监控</text>
        <text x="330" y="118" fill="#6E6E73" font-size="9" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle">pyserial · location</text>

        <rect x="460" y="64" width="180" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="460" y="64" width="180" height="64" rx="6" fill="rgba(255,255,255,0.82)" stroke="rgba(29,29,31,0.24)" stroke-width="1"/>
        <rect x="470" y="74" width="34" height="12" rx="2" fill="none" stroke="rgba(29,29,31,0.22)" stroke-width="0.8"/>
        <text x="487" y="83" fill="#6E6E73" font-size="7" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="550" y="104" fill="#1D1D1F" font-size="13" font-weight="600" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">主窗口</text>
        <text x="550" y="118" fill="#6E6E73" font-size="9" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle">AutoTest · Qt</text>

        <rect x="680" y="64" width="180" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="680" y="64" width="180" height="64" rx="6" fill="rgba(0,122,255,0.06)" stroke="#007AFF" stroke-width="1"/>
        <rect x="690" y="74" width="34" height="12" rx="2" fill="none" stroke="rgba(0,122,255,0.40)" stroke-width="0.8"/>
        <text x="707" y="83" fill="#0055CC" font-size="7" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
        <text x="770" y="104" fill="#1D1D1F" font-size="13" font-weight="600" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">CH4 Runner</text>
        <text x="770" y="118" fill="#6E6E73" font-size="9" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle">QThread · DUT-only</text>

        <rect x="900" y="64" width="180" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="900" y="64" width="180" height="64" rx="6" fill="rgba(255,255,255,0.82)" stroke="rgba(29,29,31,0.24)" stroke-width="1"/>
        <rect x="910" y="74" width="34" height="12" rx="2" fill="none" stroke="rgba(29,29,31,0.22)" stroke-width="0.8"/>
        <text x="927" y="83" fill="#6E6E73" font-size="7" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DUT</text>
        <text x="990" y="104" fill="#1D1D1F" font-size="13" font-weight="600" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">DUT</text>
        <text x="990" y="118" fill="#6E6E73" font-size="9" font-family="'Menlo', 'SF Mono', monospace" text-anchor="middle">COM3 · MI_02</text>

        <!-- Legend -->
        <line x1="56" y1="750" x2="1044" y2="750" stroke="rgba(29,29,31,0.10)" stroke-width="0.8"/>
        <text x="56" y="770" fill="#6E6E73" font-size="10" font-family="'Menlo', 'SF Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="150" y="760" width="14" height="10" rx="2" fill="rgba(0,122,255,0.06)" stroke="#007AFF" stroke-width="1"/>
        <text x="172" y="770" fill="#6E6E73" font-size="12" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">焦点 Runner</text>

        <rect x="300" y="756" width="4" height="18" fill="rgba(29,29,31,0.06)" stroke="#6E6E73" stroke-width="0.8"/>
        <text x="314" y="770" fill="#6E6E73" font-size="12" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">激活区间</text>

        <line x1="430" y1="766" x2="460" y2="766" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#ab-arrow)"/>
        <text x="470" y="770" fill="#6E6E73" font-size="12" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">调用</text>

        <line x1="550" y1="766" x2="580" y2="766" stroke="#6E6E73" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ab-arrow)"/>
        <text x="590" y="770" fill="#6E6E73" font-size="12" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">返回 / 事件</text>

        <line x1="720" y1="766" x2="750" y2="766" stroke="#FF3B30" stroke-width="1.3" marker-end="url(#ab-arrow-danger)"/>
        <text x="760" y="770" fill="#6E6E73" font-size="12" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">中止</text>

        <line x1="840" y1="766" x2="870" y2="766" stroke="#FF3B30" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ab-arrow-danger)"/>
        <text x="880" y="770" fill="#6E6E73" font-size="12" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">FAIL 结果</text>
      </svg>
    </div>
  </div>
</body>
</html>
